<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArienX Cloud Core</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:720px;background:#091116;color:#e8f4f8}section{border:1px solid #25434e;border-radius:10px;padding:1rem;margin:1rem 0}input,select,textarea,button{font:inherit;padding:.55rem;margin:.25rem 0;width:100%;box-sizing:border-box}button{background:#14b8d4;color:#001014;border:0;border-radius:6px;font-weight:700;cursor:pointer}.hidden{display:none}#status{color:#8ce1f0}pre{white-space:pre-wrap;background:#001014;padding:.75rem;border-radius:6px}</style>
<body><h1>ArienX Cloud Core</h1><p id="status">Checking secure session…</p>
<section id="auth"><h2>Sign in</h2><form id="login"><input id="email" type="email" autocomplete="email" placeholder="Email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button></form><h2>Create an account</h2><form id="signup"><input id="signup-email" type="email" autocomplete="email" placeholder="Email" required><input id="signup-password" type="password" autocomplete="new-password" minlength="8" placeholder="Password (8+ characters)" required><button>Create account</button></form><form id="invite" class="hidden"><h2>Accept your invite</h2><input id="invite-password" type="password" autocomplete="new-password" placeholder="Choose a password" required><button>Accept invite</button></form></section>
<main id="app" class="hidden"><section><button id="logout">Sign out</button><p>Pair a desktop from ArienX → Settings → Cloud Core. It creates its own local device key; this site never receives it.</p></section><section><h2>Paired desktop</h2><select id="device"></select><button id="refresh-device" type="button">Refresh device status</button><button id="system-status" type="button">Request device system status</button><pre id="tasks"></pre></section><section><h2>Cloud chat</h2><form id="chat"><textarea id="message" required placeholder="Ask ArienX Cloud Core…"></textarea><button>Send</button></form><pre id="reply"></pre></section><section><h2>Cloud-safe memory</h2><form id="memory"><select id="category"><option>preferences</option><option>projects</option><option>notes</option></select><input id="memory-key" maxlength="80" placeholder="Name" required><textarea id="memory-value" maxlength="380" placeholder="Value" required></textarea><button>Save cloud-safe fact</button></form><pre id="facts"></pre></section></main>
<script>
const $=id=>document.getElementById(id), call=async(path,body)=>{const r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};
async function tasks(){const id=$('device').value;if(!id){$('tasks').textContent='Pair a desktop in ArienX first.';return}const d=await call('/api/bridge/tasks?device_id='+encodeURIComponent(id));$('tasks').textContent=d.tasks.map(t=>t.action+': '+t.status+(t.result?' — '+t.result:'')).join('\n')||'No recent tasks.'}
async function devices(){const d=await call('/api/bridge/devices');$('device').replaceChildren(...d.devices.map(x=>new Option(x.label+' — '+(x.online?'online':'offline'),x.device_id)));await tasks()}
async function refresh(){try{const u=await call('/api/auth/session');$('status').textContent='Signed in as '+u.email;$('auth').classList.add('hidden');$('app').classList.remove('hidden');const m=await call('/api/memory');$('facts').textContent=Object.values(m.facts||{}).map(f=>f.category+': '+f.key+' — '+f.value).join('\n')||'No cloud-safe facts yet.';await devices()}catch{$('status').textContent='Sign in or create an ArienX account.';$('auth').classList.remove('hidden');$('app').classList.add('hidden')}}
const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('invite_token')){$('login').classList.add('hidden');$('signup').classList.add('hidden');$('invite').classList.remove('hidden')}if(hash.get('confirmation_token')){call('/api/auth/confirm',{token:hash.get('confirmation_token')}).then(()=>{history.replaceState(null,'',location.pathname);refresh()}).catch(x=>{$('status').textContent=x.message})}$('login').onsubmit=async e=>{e.preventDefault();try{await call('/api/auth/login',{email:$('email').value,password:$('password').value});refresh()}catch(x){$('status').textContent=x.message}};$('signup').onsubmit=async e=>{e.preventDefault();try{const r=await call('/api/auth/signup',{email:$('signup-email').value,password:$('signup-password').value});$('status').textContent=r.confirmation_required?'Check your email to confirm your account, then sign in.':'Account created. You can sign in now.'}catch(x){$('status').textContent=x.message}};$('invite').onsubmit=async e=>{e.preventDefault();try{await call('/api/auth/invite',{token:hash.get('invite_token'),password:$('invite-password').value});history.replaceState(null,'',location.pathname);refresh()}catch(x){$('status').textContent=x.message}};$('logout').onclick=async()=>{await call('/api/auth/logout',{});refresh()};$('refresh-device').onclick=devices;$('device').onchange=tasks;$('system-status').onclick=async()=>{try{await call('/api/bridge/tasks',{device_id:$('device').value,action:'system_status',args:{}});$('tasks').textContent='System-status task queued. Refresh in a moment.'}catch(x){$('tasks').textContent=x.message}};$('chat').onsubmit=async e=>{e.preventDefault();try{$('reply').textContent=(await call('/api/chat',{message:$('message').value})).reply}catch(x){$('reply').textContent=x.message}};$('memory').onsubmit=async e=>{e.preventDefault();try{const current=await call('/api/memory');const fact={category:$('category').value,key:$('memory-key').value,value:$('memory-value').value};const saved=await fetch('/api/memory',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:current.revision,facts:[fact]})});if(!saved.ok)throw Error((await saved.json()).error||'Memory was not saved');refresh()}catch(x){$('facts').textContent=x.message}};refresh();
</script></body></html>
